<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ReadFlow</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      font-size: 14px;
      width: 300px;
      padding: 12px;
      background: #1a1a2e;
      color: #e0e0e0;
    }

    h1 {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 12px;
      color: #ffe066;
      letter-spacing: 0.05em;
    }

    .row {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
      align-items: center;
    }

    button {
      flex: 1;
      padding: 7px 10px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
      font-weight: 600;
      transition: opacity 0.15s;
    }
    button:hover { opacity: 0.85; }
    button:disabled { opacity: 0.4; cursor: default; }

    #btn-play  { background: #ffe066; color: #1a1a2e; }
    #btn-stop  { background: #ff6b6b; color: #fff; }
    #btn-sel   { background: #4ecdc4; color: #1a1a2e; }

    label {
      font-size: 12px;
      color: #aaa;
      display: block;
      margin-bottom: 4px;
    }

    .field { margin-bottom: 10px; }

    input[type=range] {
      width: 100%;
      accent-color: #ffe066;
    }

    select {
      width: 100%;
      padding: 5px;
      border-radius: 6px;
      border: 1px solid #444;
      background: #2a2a4a;
      color: #e0e0e0;
      font-size: 13px;
    }

    #status {
      font-size: 12px;
      color: #aaa;
      min-height: 18px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      border-top: 1px solid #333;
      padding-top: 8px;
      margin-top: 2px;
    }

    #speed-val {
      font-size: 12px;
      color: #ffe066;
      min-width: 36px;
      text-align: right;
    }
  </style>
</head>
<body>
  <h1>ReadFlow</h1>

  <div class="row">
    <button id="btn-play">▶ Play</button>
    <button id="btn-stop">■ Stop</button>
  </div>

  <div class="row">
    <button id="btn-sel">Read selection</button>
  </div>

  <div class="field">
    <label for="speed">Speed</label>
    <div class="row" style="margin-bottom:0">
      <input type="range" id="speed" min="0.5" max="2.0" step="0.1" value="1.0" />
      <span id="speed-val">1.0×</span>
    </div>
  </div>

  <div class="field">
    <label for="voice">Voice</label>
    <select id="voice"><option value="">Default</option></select>
  </div>

  <div id="status">Ready</div>

  <script src="popup.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Louder promo tile</title>
<!-- The store promo tiles and the social preview card. Chosen by ?kind=small|marquee|og;
     rendered by scripts/render-store.mjs. -->
<style>
@font-face { font-family: "DM Sans"; font-weight: 100 1000; font-display: block; src: url("/landing/fonts/dm-sans-latin-wght-normal.woff2") format("woff2"); }
:root { --accent: #46edd5; --text: #eaf5f3; --sub: #9db8b3; }
* { box-sizing: border-box; }
html, body { margin: 0; overflow: hidden; }
body {
  font-family: "DM Sans", system-ui, sans-serif; color: var(--text); position: relative;
  background: radial-gradient(70% 90% at 90% 0%, rgba(70,237,213,.22), transparent 60%), linear-gradient(180deg, #0d1f1c 0%, #08120f 100%);
}
.name { font-weight: 800; letter-spacing: -.03em; color: var(--accent); line-height: 1; }
.tag { color: var(--sub); line-height: 1.25; }
.copy { position: absolute; }
.copy img { display: block; }
.card { position: absolute; border-radius: 14px; overflow: hidden; box-shadow: 0 24px 60px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.1); }
.card img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: left top; }

/* small tile 440x280 */
body.small { width: 440px; height: 280px; }
.small .copy { left: 32px; top: 40px; }
.small .copy img { width: 64px; height: 64px; margin-bottom: 18px; }
.small .name { font-size: 50px; }
.small .tag { font-size: 18px; margin-top: 10px; width: 230px; }
.small .card { left: 236px; top: 196px; width: 300px; height: 150px; border-radius: 12px; }

/* marquee 1400x560 and social card 1200x630 */
body.marquee { width: 1400px; height: 560px; }
body.og { width: 1200px; height: 630px; }
.marquee .copy { left: 96px; top: 150px; }
.og .copy { left: 80px; top: 96px; }
.marquee .copy img, .og .copy img { width: 96px; height: 96px; margin-bottom: 26px; }
.marquee .name { font-size: 104px; }
.og .name { font-size: 96px; }
.marquee .tag, .og .tag { font-size: 30px; margin-top: 16px; width: 440px; }
.marquee .card { left: 700px; top: 100px; width: 640px; height: 320px; }
.og .card { left: 600px; top: 300px; width: 640px; height: 320px; }
</style>
</head>
<body>
<div class="copy">
  <img src="/public/icons/icon128.png" alt="">
  <div class="name">Louder</div>
  <div class="tag">Distraction-free text-to-speech reader</div>
</div>
<div class="card"><img id="shot" alt=""></div>
<script>
const kind = new URLSearchParams(location.search).get("kind") || "marquee";
document.body.className = kind;
// a window onto the real extension: the control bar, its settings and the line being read
document.getElementById("shot").src = "/dist/render/tile-card.png";
</script>
</body>
</html>
